{% extends "base.html" %}
{% block title %}Dashboard — Acme Internal{% endblock %}
{% block content %}
<div class="card">
  <nav><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('admin') }}">Admin</a><a href="{{ url_for('logout') }}">Sign out</a></nav>
  <h1>Welcome, {{ user.sub }}</h1>
  <p class="muted">You are signed in with role <strong>{{ user.role }}</strong>.</p>
  <table>
    <tr><th>Claim</th><th>Value</th></tr>
    {% for key, value in user.items() %}<tr><td>{{ key }}</td><td>{{ value }}</td></tr>{% endfor %}
  </table>
</div>
{% endblock %}
